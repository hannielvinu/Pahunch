name: Android app
# Builds the Pahunch Android app (android/) and publishes it as the "app-latest" release:
#   https://github.com/hannielvinu/Pahunch/releases/download/app-latest/Pahunch.apk
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Build APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/pahunch.jks"
          KS="$RUNNER_TEMP/pahunch.jks" bash android/build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest android/build/Pahunch.apk --title "Pahunch Android app" --notes "Built from ${GITHUB_SHA::7}. Install on the phone, start the engine in Termux (bash tools/start.sh --bg)."
