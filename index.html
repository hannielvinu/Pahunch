<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Pahunch</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script src="lib/tesseract/tesseract.min.js" defer></script>
  <script src="js/app.js" type="module"></script>
</head>
<body>
  <section id="home" class="screen">
    <header class="brand">
      <h1>Pahunch</h1>
      <p>Maps get you to the lane. Pahunch gets you to the door.</p>
    </header>
    <label class="label" for="note">Directions, as the customer said them</label>
    <textarea id="note" rows="6" placeholder="Ganesh mandir ke baad doosri gali mein baayen, MedPlus ke saamne neela gate…"></textarea>
    <div class="row">
      <button id="paste" class="btn ghost">Paste from laptop</button>
      <div id="samples" class="chips" aria-label="Sample notes"></div>
    </div>
    <div class="row">
      <label class="label inline" for="voice">Voice</label>
      <select id="voice">
        <option value="auto">Auto (same as note)</option>
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="kn">ಕನ್ನಡ</option>
        <option value="ta">தமிழ்</option>
      </select>
    </div>
    <button id="parse" class="btn primary big">Plan route</button>
    <details class="device">
      <summary>Device check</summary>
      <pre id="device">checking…</pre>
    </details>
  </section>

  <section id="plan" class="screen" hidden>
    <h2>Route plan</h2>
    <p id="parsed-by" class="meta"></p>
    <ol id="steps" class="steps"></ol>
    <p id="floor" class="meta big-meta"></p>
    <div class="row end">
      <button id="edit" class="btn ghost">Edit</button>
      <button id="start" class="btn primary big">Start guidance</button>
    </div>
  </section>

  <section id="guide" class="screen guide" hidden>
    <video id="video" playsinline muted></video>
    <div id="flash" class="flash"></div>
    <div class="hud top">
      <div id="step-count" class="meta"></div>
      <div id="step-line" class="step-now"></div>
      <div id="seen" class="seen"></div>
    </div>
    <div id="colour-bars" class="colour-bars" hidden><i></i><i></i><i></i></div>
    <div id="ask" class="ask" hidden>
      <p id="ask-q"></p>
      <div class="row">
        <button id="notyet" class="btn ghost big">Not yet</button>
        <button id="yes" class="btn primary big">Yes</button>
      </div>
    </div>
    <div class="hud bottom">
      <div class="meta"><span id="ocr-ms"></span> · <span id="heading"></span></div>
      <div class="row">
        <button id="stop" class="btn ghost">Stop</button>
        <button id="skip" class="btn ghost">Skip step</button>
        <button id="turned" class="btn primary" hidden>I've turned</button>
      </div>
    </div>
  </section>

  <section id="arrive" class="screen arrive" hidden>
    <div class="tick">✓</div>
    <h2>You've arrived</h2>
    <p id="arrived-what" class="big-meta"></p>
    <p id="arrived-floor" class="big-meta"></p>
    <p id="arrived-time" class="meta"></p>
    <button id="again" class="btn primary big">New route</button>
  </section>

  <div id="toast" class="toast" hidden></div>
</body>
</html>
